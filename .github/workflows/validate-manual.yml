name: S1 Astro build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate Astro static build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run build
      - name: Assert generated index exists
        run: test -s dist/index.html
